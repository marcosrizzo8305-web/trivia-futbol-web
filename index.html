<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trivia Fútbol</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="menu">
    <select id="liga-select"></select>
    <select id="team-select"></select>
    <button id="btnEntrar">Entrar a la Liga</button>
  </div>

  <div id="liga" style="display:none;">
    <h2 id="liga-nombre"></h2>
    <table id="tabla-posiciones"></table>
    <div id="fixture"></div>
    <button onclick="startMatch()">Jugar próximo partido</button>
  </div>

  <div id="match" style="display:none;">
    <h2 id="match-info"></h2>
    <div id="score"></div>
    <div id="timer"></div>
    <div id="question"></div>
    <div id="options"></div>
    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
