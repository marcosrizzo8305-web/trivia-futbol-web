<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trivia Futbol</title>
  <!-- Enlace al CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Título -->
    <h1 id="game-title">Trivia Futbol</h1>

    <!-- Menú inicial -->
    <div id="menu">
      <button class="premium-btn" onclick="startGame()">Jugar</button>
    </div>

    <!-- Juego -->
    <div id="game" style="display:none;">
      <h2 id="question"></h2>
      <div id="options" class="options-grid"></div>
      <p id="result"></p>
    </div>

    <!-- Sonidos -->
    <audio id="sound-correct" src="https://www.soundjay.com/button/sounds/button-3.mp3"></audio>
    <audio id="sound-wrong" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>
  </div>

  <!-- Enlace al JS -->
  <script src="script.js"></script>
</body>
</html>
